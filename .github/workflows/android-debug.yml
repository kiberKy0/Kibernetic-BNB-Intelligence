name: Android preview APK
on:
  push:
    branches: [feature/android-play-store-v1]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --project-dir android-app :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kibernetic-BNB-Android-test
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
